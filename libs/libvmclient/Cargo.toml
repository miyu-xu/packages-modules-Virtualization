[package]
name = "vmclient"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Client library for VirtualizationService (host / vm tool)"

[lib]
name = "vmclient"
path = "src/lib.rs"

[dependencies]
android_system_virtualizationcommon = { path = "../../android/virtualizationservice/aidl/android/system/virtualizationcommon" }
android_system_virtualizationservice = { path = "../../android/virtualizationservice/aidl/android/system/virtualizationservice" }
binder = { path = "../../../../../frameworks/native/libs/binder/rust" }
rpcbinder = { path = "../../../../../frameworks/native/libs/binder/rust/rpcbinder" }
log = "0.4"
shared_child = "1.0"
thiserror = "1.0"
libc = "0.2"

[target.'cfg(unix)'.dependencies]
command-fds = "0.3"
nix = { version = "0.28", features = ["socket", "uio"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["errhandlingapi", "fileapi", "processthreadsapi", "handleapi", "winbase", "minwindef", "winsock2", "namedpipeapi", "winnt"] }
